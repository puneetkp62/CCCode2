<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organisation Dashboard — EmpStats</title>
<link rel="stylesheet" href="/style.css">
<style>
.tab-hidden{display:none;}
#pagination-emp{margin-top:14px;}
.table-scroll{overflow-x:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">✚</div>
      <div class="brand-name" id="org-name">EmpStats</div>
      <div class="role-chip" id="role-chip">Organisation</div>
    </div>
    <button class="btn-ghost" onclick="authLogout()">Sign out</button>
  </div>
  <div class="body-card" id="app">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="/auth.js"></script>
<script>
'use strict';

let sessionData = {};
let dashData = null;
let trendData = null;
let slicerOptions = {};
let filters = { division:'', location:'', band:'', zone:'', vertical:'', age_range:'', gender:'' };
let activeTab = 'overview';
let charts = {};

const RISK_COLORS = { 'Excellent':'#2e7d32', 'Good':'#4caf50', 'Average':'#ff9800', 'Below Average':'#e07c3e', 'Concerning':'#d32f2f' };
const CAT_COLORS = { 'Normal':'#2e7d32', 'Low Risk':'#b26a00', 'Medium Risk':'#e07c3e', 'High Risk':'#d32f2f', 'Not Available':'#9e9e9e' };

if (window.ChartDataLabels) Chart.register(ChartDataLabels);

async function init() {
  const session = await authRequire('org');
  if (!session) return;
  const chip = document.getElementById('role-chip');
  if (chip && session.username) chip.textContent = 'Organisation · ' + session.username;
  const cfg = await getConfig();
  sessionData.cfg = cfg;
  if (cfg.orgName) document.getElementById('org-name').textContent = cfg.orgName;

  const optRes = await apiFetch('/api/slicer-options');
  slicerOptions = (optRes && !optRes.error) ? optRes : {};

  renderShell();
  await loadDashboard();
}

/* ═══════════════════════════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════════════════════════ */

function renderShell() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderSlicerBar()}
    <div class="dash-tabs">
      <div class="dash-tab" data-tab="overview" onclick="switchTab('overview')">Overview</div>
      <div class="dash-tab" data-tab="risk" onclick="switchTab('risk')">Risk Analysis</div>
      <div class="dash-tab" data-tab="consultations" onclick="switchTab('consultations')">Consultations</div>
    </div>
    <div id="dash-body">
      <div class="loader"><div class="spinner"></div></div>
    </div>`;
  markActiveTab();
}

function renderSlicerBar() {
  const opts = slicerOptions;
  const sel = (id, label, list, key) => `
    <select id="${id}" onchange="onFilterChange('${key}', this.value)">
      <option value="">${h(label)}</option>
      ${(list||[]).map(v=>`<option value="${h(v)}" ${filters[key]===v?'selected':''}>${h(v)}</option>`).join('')}
    </select>`;
  return `
    <div class="slicer-bar">
      ${sel('f-division','All Divisions', opts.divisions, 'division')}
      ${sel('f-location','All Locations', opts.locations, 'location')}
      ${sel('f-band','All Bands', opts.bands, 'band')}
      ${sel('f-zone','All Zones', opts.zones, 'zone')}
      ${sel('f-vertical','All Verticals', opts.verticals, 'vertical')}
      ${sel('f-age','All Age Groups', opts.age_ranges, 'age_range')}
      ${sel('f-gender','All Genders', opts.genders, 'gender')}
      <span class="slicer-reset" onclick="resetFilters()">Reset filters</span>
    </div>`;
}

function onFilterChange(key, value) {
  filters[key] = value;
  loadDashboard();
}

function resetFilters() {
  Object.keys(filters).forEach(k => filters[k] = '');
  document.querySelectorAll('.slicer-bar select').forEach(s => s.value = '');
  loadDashboard();
}

function switchTab(tab) {
  activeTab = tab;
  markActiveTab();
  renderDashBody();
}

function markActiveTab() {
  document.querySelectorAll('.dash-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === activeTab);
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   DATA LOADING
   ═══════════════════════════════════════════════════════════════════════════ */

async function loadDashboard() {
  const body = document.getElementById('dash-body');
  body.innerHTML = '<div class="loader"><div class="spinner"></div></div>';

  const qs = new URLSearchParams();
  Object.entries(filters).forEach(([k,v]) => { if (v) qs.set(k, v); });

  const [dashRes, trendRes] = await Promise.all([
    apiFetch(`/api/org/dashboard?${qs.toString()}`),
    trendData ? Promise.resolve(trendData) : apiFetch('/api/org/trend')
  ]);

  if (!dashRes || dashRes.error) {
    body.innerHTML = `<p style="text-align:center;color:var(--red);padding:40px;">${h(dashRes?.error || 'Failed to load dashboard.')}</p>`;
    return;
  }
  dashData = dashRes;
  if (!trendData) trendData = (trendRes && !trendRes.error) ? trendRes : {};

  renderDashBody();
}

/* ═══════════════════════════════════════════════════════════════════════════
   DASH BODY / TABS
   ═══════════════════════════════════════════════════════════════════════════ */

function renderDashBody() {
  const body = document.getElementById('dash-body');
  if (!dashData) { body.innerHTML = '<div class="loader"><div class="spinner"></div></div>'; return; }

  if (activeTab === 'overview') renderOverview(body);
  else if (activeTab === 'risk') renderRisk(body);
  else renderConsultations(body);
}

/* ── Overview ─────────────────────────────────────────────────────────── */

function renderOverview(body) {
  const d = dashData;
  const highRiskCount = Object.keys(d.abnormal_by_emp || {}).length;
  const flaggedTotal = Object.values(d.flagged_readings || {}).reduce((a,b)=>a+b, 0);
  const inhouseCount = (d.inhouse || []).length;

  body.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card kpi-default">
        <div class="kpi-num">${h(d.total_employees ?? 0)}</div>
        <div class="kpi-lbl">Total Employees</div>
      </div>
      <div class="kpi-card ${highRiskCount>0?'kpi-danger':'kpi-default'}">
        <div class="kpi-num">${h(highRiskCount)}</div>
        <div class="kpi-lbl">High Risk Employees</div>
      </div>
      <div class="kpi-card kpi-warn">
        <div class="kpi-num">${h(flaggedTotal)}</div>
        <div class="kpi-lbl">Flagged Readings</div>
      </div>
      <div class="kpi-card kpi-info">
        <div class="kpi-num">${h(inhouseCount)}</div>
        <div class="kpi-lbl">In-house Consultations</div>
      </div>
    </div>
    <div class="chart-grid-2">
      <div class="chart-box">
        <div class="chart-title">Overall Risk Distribution</div>
        <canvas id="chart-overall-risk"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">Year-over-Year Trend</div>
        <canvas id="chart-trend"></canvas>
      </div>
    </div>`;

  drawDoughnut('chart-overall-risk', d.overall_risk || {}, RISK_COLORS);
  drawTrendChart('chart-trend', trendData || {});
}

/* ── Risk Analysis ────────────────────────────────────────────────────── */

function renderRisk(body) {
  const d = dashData;

  const flaggedRows = Object.entries(d.flagged_readings || {})
    .sort((a,b) => b[1]-a[1]);

  const empById = {};
  (d.emp_list || []).forEach(e => { empById[e.opaque_id] = e; });
  const highRiskRows = Object.entries(d.abnormal_by_emp || {}).map(([oid, params]) => {
    const emp = empById[oid] || {};
    return { name: emp.employee_name || oid, params };
  });

  body.innerHTML = `
    <div class="chart-grid-3">
      <div class="chart-box">
        <div class="chart-title">Blood Sugar</div>
        <canvas id="chart-bs"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">Lipid Profile</div>
        <canvas id="chart-lipid"></canvas>
      </div>
      <div class="chart-box">
        <div class="chart-title">Thyroid Profile</div>
        <canvas id="chart-thyroid"></canvas>
      </div>
    </div>

    <div class="section-title">Top Flagged Readings</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Parameter</th><th>High Risk Count</th></tr></thead>
        <tbody>
          ${flaggedRows.length ? flaggedRows.map(([param, count]) => `
            <tr><td>${h(param)}</td><td>${riskBadge('High Risk')} ${h(count)}</td></tr>
          `).join('') : `<tr><td colspan="2" style="text-align:center;color:var(--muted);">No flagged readings.</td></tr>`}
        </tbody>
      </table>
    </div>

    <div class="section-title" style="margin-top:24px;">High Risk Employees</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Employee Name</th><th>Abnormal Parameters</th></tr></thead>
        <tbody>
          ${highRiskRows.length ? highRiskRows.map(r => `
            <tr><td>${h(r.name)}</td><td>${(r.params||[]).map(p=>h(p)).join(', ')}</td></tr>
          `).join('') : `<tr><td colspan="2" style="text-align:center;color:var(--muted);">No high risk employees.</td></tr>`}
        </tbody>
      </table>
    </div>`;

  drawDoughnut('chart-bs', d.blood_sugar || {}, CAT_COLORS);
  drawDoughnut('chart-lipid', d.lipid || {}, CAT_COLORS);
  drawDoughnut('chart-thyroid', d.thyroid || {}, CAT_COLORS);
}

/* ── Consultations ────────────────────────────────────────────────────── */

function renderConsultations(body) {
  const rows = (dashData.inhouse || []).slice(0, 100);

  body.innerHTML = `
    <div class="section-title">Recent In-house Consultations</div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>Employee</th><th>Date</th><th>Doctor</th><th>Complaint</th><th>Diagnosis</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td>${h(r.employee_name || r.opaque_id)}</td>
              <td>${fmtDate(r.visit_date)}</td>
              <td>${h(r.doctor_name || '—')}</td>
              <td>${h(r.complaint || '—')}</td>
              <td>${h(r.diagnosis || '—')}</td>
            </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--muted);">No consultations found.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   CHARTS
   ═══════════════════════════════════════════════════════════════════════════ */

function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function drawDoughnut(canvasId, dataObj, colorMap) {
  destroyChart(canvasId);
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const labels = Object.keys(dataObj);
  const values = Object.values(dataObj);
  if (!labels.length || values.every(v => !v)) {
    const ctx = canvas.getContext('2d');
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#6b7d72';
    ctx.textAlign = 'center';
    ctx.fillText('No data available', canvas.width/2, canvas.height/2);
    return;
  }
  charts[canvasId] = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: labels.map(l => colorMap[l] || '#9e9e9e'),
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      cutout: '55%',
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 } } },
        datalabels: {
          color: '#fff',
          font: { weight: 'bold', size: 12 },
          formatter: (v) => v > 0 ? v : ''
        }
      }
    }
  });
}

function drawTrendChart(canvasId, data) {
  destroyChart(canvasId);
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const years = Object.keys(data).sort();
  if (!years.length) {
    const ctx = canvas.getContext('2d');
    ctx.font = '13px sans-serif';
    ctx.fillStyle = '#6b7d72';
    ctx.textAlign = 'center';
    ctx.fillText('No trend data available', canvas.width/2, canvas.height/2);
    return;
  }
  const categories = Object.keys(RISK_COLORS);
  const datasets = categories.map(cat => ({
    label: cat,
    data: years.map(y => (data[y] && data[y][cat]) || 0),
    backgroundColor: RISK_COLORS[cat]
  }));
  charts[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: { labels: years, datasets },
    options: {
      responsive: true,
      scales: {
        x: { stacked: true },
        y: { stacked: true, beginAtZero: true }
      },
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 } } },
        datalabels: {
          color: '#fff',
          font: { weight: 'bold', size: 10 },
          formatter: (v) => v > 0 ? v : ''
        }
      }
    }
  });
}

init();
</script>
</body>
</html>
